description: The Mbiling desktop app in your browser. `mbiling workbench` serves the desktop interface through the Mbiling dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `mbiling workbench` run and again after each Mbiling update it runs `npm install --ignore-scripts` (guided by Mbiling's lockfile) and Vite against your Mbiling checkout's desktop sources, writing only under ~/.mbiling/mbiling-workbench and its own plugin dir (the checkout is only read), and starts `mbiling dashboard` on loopback when none is running.
