# Services du serveur Mbiling (phase 0).
# Toutes les valeurs viennent de `.env` (voir `.env.exemple`). Lancer avec `./installer.sh`.
name: mbiling

services:
  # Porte d'entrée unique : le tunnel envoie tout ici, puis la passerelle répartit
  # entre la cellule et le Relais. Elle n'écoute que sur 127.0.0.1.
  passerelle:
    image: ${MBILING_IMAGE_CADDY:?voir .env.exemple}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MBILING_PORT_LOCAL:?voir .env.exemple}:8090"
    environment:
      MBILING_DOMAINE: ${MBILING_DOMAINE:?voir .env.exemple}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - passerelle_donnees:/data
    networks:
      - interne

  # La cellule de l'organisation de test : le moteur en mode serveur, joignable
  # seulement par la passerelle (réseau interne, aucun port publié).
  cellule:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    restart: unless-stopped
    # Le programme principal ne fait rien : l'interface web (qui sert aussi le Desktop) tourne
    # comme service supervisé (MBILING_DASHBOARD=1). Avec « dashboard » comme commande, l'image
    # n'enregistrerait pas les services des agents et le chat web ne démarrerait pas.
    command: ["sleep", "infinity"]
    environment:
      MBILING_DASHBOARD: "1"
      MBILING_DASHBOARD_SESSION_TOKEN: ${MBILING_JETON_CELLULE:?généré par installer.sh}
      # Connexion par identifiant et mot de passe (fournisseur « basic » du moteur).
      MBILING_DASHBOARD_BASIC_AUTH_USERNAME: ${MBILING_CONNEXION_IDENTIFIANT:?voir .env.exemple}
      MBILING_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${MBILING_CONNEXION_EMPREINTE:?calculée par installer.sh}
      MBILING_DASHBOARD_BASIC_AUTH_SECRET: ${MBILING_CONNEXION_SECRET:?généré par installer.sh}
      MBILING_RELAIS_URL: http://relais:8000
      MBILING_RELAIS_JETON: ${MBILING_RELAIS_JETON_INTERNE:?généré par installer.sh}
      MBILING_RELAIS_URL_PUBLIQUE: wss://${MBILING_DOMAINE}/mains
      MBILING_ORGANISATION: ${MBILING_ORGANISATION:?voir .env.exemple}
      # Les commandes des agents s'exécutent toujours sur le PC du client, jamais dans la cellule,
      # même si l'écran des réglages d'un profil remet son terminal sur « local ».
      MBILING_TERMINAL_IMPOSE: ${MBILING_TERMINAL_CELLULE:-mbiling_mains}
      # Les fichiers que l'agent écrit sont donc sur le PC : c'est la politique des Mains du PC
      # (dossiers autorisés) qui les limite, pas le dossier /opt/data de l'image.
      MBILING_WRITE_SAFE_ROOT: ""
    volumes:
      - ${MBILING_DONNEES}/cellules/${MBILING_ORGANISATION}/data:/opt/data
      # Le module des Mains suit le dépôt (git pull), sans reconstruire l'image du moteur.
      - ../plugins/mbiling_mains:/opt/mbiling/plugins/mbiling_mains:ro
    mem_limit: ${MBILING_CELLULE_MEMOIRE:?voir .env.exemple}
    cpus: ${MBILING_CELLULE_CPU:?voir .env.exemple}
    depends_on:
      - relais
    networks:
      - interne

  # Le Relais des Mains : relie la cellule au PC de l'utilisateur. Même image que le moteur.
  relais:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    restart: unless-stopped
    command: ["/opt/mbiling/.venv/bin/python", "-m", "uvicorn", "mbiling_cloud.relais.app:creer_app",
              "--factory", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment:
      MBILING_RELAIS_CONFIG: /etc/mbiling/relais.yaml
      MBILING_RELAIS_JETON_INTERNE: ${MBILING_RELAIS_JETON_INTERNE:?généré par installer.sh}
      MBILING_JETON_APPAREIL_PC_TEST_1: ${MBILING_JETON_APPAREIL_PC_TEST_1:?généré par installer.sh}
    volumes:
      - ./relais.yaml:/etc/mbiling/relais.yaml:ro
      # Le code du Relais suit le dépôt (git pull), sans reconstruire l'image du moteur.
      - ../mbiling_cloud:/opt/mbiling/mbiling_cloud:ro
      - ${MBILING_DONNEES}/relais:/opt/data
    networks:
      - interne

  # Tunnel Cloudflare vers MBILING_DOMAINE. Activé par installer.sh seulement si le
  # fichier du jeton existe. En réseau hôte, pour joindre 127.0.0.1:MBILING_PORT_LOCAL.
  tunnel:
    image: ${MBILING_IMAGE_CLOUDFLARED:?voir .env.exemple}
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/mbiling/tunnel.token"]
    volumes:
      - ${MBILING_JETON_TUNNEL_FICHIER:?voir .env.exemple}:/run/mbiling/tunnel.token:ro
    depends_on:
      - passerelle

volumes:
  passerelle_donnees:

networks:
  interne:
