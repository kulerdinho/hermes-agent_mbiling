# Services du serveur Mbiling (phase 0).
# Toutes les valeurs viennent de `.env` (voir `.env.exemple`). Lancer avec `./installer.sh`.
name: mbiling

services:
  # Porte d'entrée unique : le tunnel envoie tout ici, puis la passerelle répartit
  # entre la cellule et le Relais. Elle n'écoute que sur 127.0.0.1.
  passerelle:
    image: ${MBILING_IMAGE_CADDY:?voir .env.exemple}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MBILING_PORT_LOCAL:?voir .env.exemple}:8090"
    environment:
      MBILING_DOMAINE: ${MBILING_DOMAINE:?voir .env.exemple}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - passerelle_donnees:/data
    networks:
      - interne

  # La cellule de l'organisation de test : le moteur en mode serveur, joignable
  # seulement par la passerelle (réseau interne, aucun port publié).
  cellule:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    restart: unless-stopped
    # Le programme principal ne fait rien : l'interface web (qui sert aussi le Desktop) tourne
    # comme service supervisé (MBILING_DASHBOARD=1). Avec « dashboard » comme commande, l'image
    # n'enregistrerait pas les services des agents et le chat web ne démarrerait pas.
    command: ["sleep", "infinity"]
    environment:
      MBILING_DASHBOARD: "1"
      MBILING_DASHBOARD_SESSION_TOKEN: ${MBILING_JETON_CELLULE:?généré par installer.sh}
      # Connexion des utilisateurs, selon MBILING_CONNEXION (installer.sh remplit l'un des deux
      # groupes et vide l'autre ; un fournisseur dont le réglage est vide ne s'active pas) :
      #  - « motdepasse » : identifiant et mot de passe partagés (fournisseur « basic », phase 0) ;
      #  - « comptes » : comptes personnels du serveur de comptes (fournisseur « self_hosted », OpenID Connect).
      MBILING_DASHBOARD_BASIC_AUTH_USERNAME: ${MBILING_CELLULE_BASIC_IDENTIFIANT:-}
      MBILING_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${MBILING_CELLULE_BASIC_EMPREINTE:-}
      MBILING_DASHBOARD_BASIC_AUTH_SECRET: ${MBILING_CONNEXION_SECRET:?généré par installer.sh}
      MBILING_DASHBOARD_OIDC_ISSUER: ${MBILING_CELLULE_OIDC_EMETTEUR:-}
      MBILING_DASHBOARD_OIDC_CLIENT_ID: ${MBILING_CELLULE_OIDC_CLIENT:-}
      MBILING_DASHBOARD_OIDC_CLIENT_SECRET: ${MBILING_CELLULE_OIDC_SECRET:-}
      MBILING_RELAIS_URL: http://relais:8000
      MBILING_RELAIS_JETON: ${MBILING_RELAIS_JETON_INTERNE:?généré par installer.sh}
      MBILING_RELAIS_URL_PUBLIQUE: wss://${MBILING_DOMAINE}/mains
      MBILING_ORGANISATION: ${MBILING_ORGANISATION:?voir .env.exemple}
      # Les commandes des agents s'exécutent toujours sur le PC du client, jamais dans la cellule,
      # même si l'écran des réglages d'un profil remet son terminal sur « local ».
      MBILING_TERMINAL_IMPOSE: ${MBILING_TERMINAL_CELLULE:-mbiling_mains}
      # Les fichiers que l'agent écrit sont donc sur le PC : c'est la politique des Mains du PC
      # (dossiers autorisés) qui les limite, pas le dossier /opt/data de l'image.
      MBILING_WRITE_SAFE_ROOT: ""
    volumes:
      - ${MBILING_DONNEES}/cellules/${MBILING_ORGANISATION}/data:/opt/data
      # Le module des Mains suit le dépôt (git pull), sans reconstruire l'image du moteur.
      - ../plugins/mbiling_mains:/opt/mbiling/plugins/mbiling_mains:ro
    mem_limit: ${MBILING_CELLULE_MEMOIRE:?voir .env.exemple}
    cpus: ${MBILING_CELLULE_CPU:?voir .env.exemple}
    depends_on:
      - relais
    networks:
      - interne

  # Le Relais des Mains : relie la cellule au PC de l'utilisateur. Même image que le moteur.
  relais:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    restart: unless-stopped
    command: ["/opt/mbiling/.venv/bin/python", "-m", "uvicorn", "mbiling_cloud.relais.app:creer_app",
              "--factory", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment:
      MBILING_RELAIS_CONFIG: /etc/mbiling/relais.yaml
      MBILING_RELAIS_JETON_INTERNE: ${MBILING_RELAIS_JETON_INTERNE:?généré par installer.sh}
      MBILING_JETON_APPAREIL_PC_TEST_1: ${MBILING_JETON_APPAREIL_PC_TEST_1:?généré par installer.sh}
    volumes:
      - ./relais.yaml:/etc/mbiling/relais.yaml:ro
      # Le code du Relais suit le dépôt (git pull), sans reconstruire l'image du moteur.
      - ../mbiling_cloud:/opt/mbiling/mbiling_cloud:ro
      - ${MBILING_DONNEES}/relais:/opt/data
    networks:
      - interne

  # Mbiling Comptes, partie identité (phase 1, lot 1) : Keycloak, servi par la passerelle sous
  # /comptes. Inscription, connexion (email, puis Google et Apple), double authentification,
  # mot de passe oublié. Démarré par installer.sh seulement si MBILING_COMPTES=1.
  comptes:
    image: ${MBILING_IMAGE_KEYCLOAK:?voir .env.exemple}
    profiles: ["comptes"]
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://comptes-db:5432/comptes
      KC_DB_USERNAME: comptes
      KC_DB_PASSWORD: ${MBILING_COMPTES_DB_MOT_DE_PASSE:?généré par installer.sh}
      # Adresse publique (derrière le tunnel et la passerelle) ; l'administration n'est servie
      # qu'en local, par un tunnel SSH vers 127.0.0.1:MBILING_COMPTES_PORT_ADMIN.
      KC_HOSTNAME: https://${MBILING_DOMAINE}/comptes
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${MBILING_COMPTES_PORT_ADMIN:?voir .env.exemple}/comptes
      KC_HTTP_RELATIVE_PATH: /comptes
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MBILING_COMPTES_ADMIN_MOT_DE_PASSE:?généré par installer.sh}
    volumes:
      # Importé une seule fois, à la création du royaume ; ensuite comptes/configurer.sh l'aligne sur .env.
      - ./comptes/royaume-mbiling.json:/opt/keycloak/data/import/royaume-mbiling.json:ro
    ports:
      - "127.0.0.1:${MBILING_COMPTES_PORT_ADMIN}:8080"
    mem_limit: ${MBILING_COMPTES_MEMOIRE:?voir .env.exemple}
    depends_on:
      - comptes-db
    networks:
      - interne

  # Management : l'espace d'administration du Cloud (https://MBILING_DOMAINE/management). Réservé aux
  # comptes qui ont un rôle management-* et la double authentification. Même image que le moteur ;
  # son code suit le dépôt (comme le Relais), sans reconstruire l'image.
  management:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    profiles: ["comptes"]
    restart: unless-stopped
    command: ["/opt/mbiling/.venv/bin/python", "-m", "uvicorn", "mbiling_cloud.management.app:creer_app",
              "--factory", "--host", "0.0.0.0", "--port", "8100", "--log-level", "warning", "--proxy-headers"]
    environment:
      MBILING_MANAGEMENT_URL: https://${MBILING_DOMAINE}/management
      MBILING_MANAGEMENT_EMETTEUR: https://${MBILING_DOMAINE}/comptes/realms/mbiling
      MBILING_MANAGEMENT_COMPTES_INTERNE: http://comptes:8080/comptes
      MBILING_MANAGEMENT_ROYAUME: mbiling
      MBILING_MANAGEMENT_CLIENT_SECRET: ${MBILING_MANAGEMENT_CLIENT_SECRET:?généré par installer.sh}
      MBILING_MANAGEMENT_API_SECRET: ${MBILING_MANAGEMENT_API_SECRET:?généré par installer.sh}
      MBILING_MANAGEMENT_CLE: ${MBILING_MANAGEMENT_CLE:?généré par installer.sh}
      MBILING_MANAGEMENT_BASE: /opt/data/management.db
      # Importés une seule fois, à la création de la base de Management (puis vidés dans .env).
      MBILING_EMAIL_SERVEUR: ${MBILING_EMAIL_SERVEUR:-}
      MBILING_EMAIL_PORT: ${MBILING_EMAIL_PORT:-}
      MBILING_EMAIL_EXPEDITEUR: ${MBILING_EMAIL_EXPEDITEUR:-}
      MBILING_EMAIL_IDENTIFIANT: ${MBILING_EMAIL_IDENTIFIANT:-}
      MBILING_EMAIL_MOT_DE_PASSE: ${MBILING_EMAIL_MOT_DE_PASSE:-}
    volumes:
      - ../mbiling_cloud:/opt/mbiling/mbiling_cloud:ro
      - ${MBILING_DONNEES}/management:/opt/data
    mem_limit: 256m
    depends_on:
      - comptes
    networks:
      - interne

  # Mon compte : l'espace de chaque utilisateur (https://MBILING_DOMAINE/compte), d'abord « Mes
  # appareils » (révoquer un PC, tout déconnecter). Même image que le moteur ; son code suit le dépôt.
  compte:
    image: ${MBILING_IMAGE_MOTEUR:?voir .env.exemple}
    profiles: ["comptes"]
    restart: unless-stopped
    command: ["/opt/mbiling/.venv/bin/python", "-m", "uvicorn", "mbiling_cloud.compte.app:creer_app",
              "--factory", "--host", "0.0.0.0", "--port", "8110", "--log-level", "warning", "--proxy-headers"]
    environment:
      MBILING_COMPTE_URL: https://${MBILING_DOMAINE}/compte
      MBILING_COMPTE_EMETTEUR: https://${MBILING_DOMAINE}/comptes/realms/mbiling
      MBILING_COMPTE_COMPTES_INTERNE: http://comptes:8080/comptes
      MBILING_COMPTE_ROYAUME: mbiling
      MBILING_COMPTE_CLIENT_SECRET: ${MBILING_COMPTE_CLIENT_SECRET:?généré par installer.sh}
      MBILING_COMPTE_CLE: ${MBILING_COMPTE_CLE:?généré par installer.sh}
      MBILING_RELAIS_URL: http://relais:8000
      MBILING_RELAIS_JETON: ${MBILING_RELAIS_JETON_INTERNE:?généré par installer.sh}
    volumes:
      - ../mbiling_cloud:/opt/mbiling/mbiling_cloud:ro
    mem_limit: 256m
    depends_on:
      - comptes
      - relais
    networks:
      - interne

  comptes-db:
    image: ${MBILING_IMAGE_POSTGRES:?voir .env.exemple}
    profiles: ["comptes"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: comptes
      POSTGRES_USER: comptes
      POSTGRES_PASSWORD: ${MBILING_COMPTES_DB_MOT_DE_PASSE:?généré par installer.sh}
    volumes:
      - ${MBILING_DONNEES}/comptes/postgres:/var/lib/postgresql/data
    networks:
      - interne

  # Tunnel Cloudflare vers MBILING_DOMAINE. Activé par installer.sh seulement si le
  # fichier du jeton existe. En réseau hôte, pour joindre 127.0.0.1:MBILING_PORT_LOCAL.
  tunnel:
    image: ${MBILING_IMAGE_CLOUDFLARED:?voir .env.exemple}
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/mbiling/tunnel.token"]
    volumes:
      - ${MBILING_JETON_TUNNEL_FICHIER:?voir .env.exemple}:/run/mbiling/tunnel.token:ro
    depends_on:
      - passerelle

volumes:
  passerelle_donnees:

networks:
  interne:
