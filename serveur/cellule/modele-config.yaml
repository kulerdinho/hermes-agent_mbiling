# Configuration de départ d'une cellule Mbiling (phase 0).
# installer.sh la copie dans le dossier de données de la cellule à sa création, en
# remplaçant la ligne @IA@ par le modèle d'IA de serveur/.env (MBILING_MODELE, MBILING_IA_URL,
# MBILING_MODELE_SECOURS, MBILING_MODELE_VISION). Ensuite, elle appartient à la cellule : une
# nouvelle installation ne l'écrase jamais. Les profils créés ensuite en reçoivent une copie.
@IA@

plugins:
  enabled: [mbiling-mains]
  # Le plugin des Mains fournit un environnement de terminal : il doit être chargé dans le moteur.
  isolation: in_process

terminal:
  # Les commandes de l'agent s'exécutent sur le PC de l'utilisateur, via le Relais.
  backend: mbiling_mains
  timeout: 60

approvals:
  mode: manual

# Mbiling Mobile se connecte comme le Desktop (connexion native par la cellule) et reçoit le
# retour sur sa propre adresse : elle doit figurer ici, à l'identique.
dashboard:
  oauth:
    retours_applis: ["mbiling://connexion"]

# Les points de restauration enregistreraient des chemins du serveur, pas ceux du PC.
checkpoints:
  enabled: false

# Mbiling n'envoie aucune statistique à l'éditeur d'origine (Nous Research) : la question
# « Share with Nous » est réputée répondue « non » (offer_version = OFFER_VERSION du moteur).
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
